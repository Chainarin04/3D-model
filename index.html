<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0b0f1a;--panel:#111827;--ink:#eef2f8;--ink2:#93a1b8;--line:#243049;--acc:#ff5a5f;--gold:#f5c542;--cyan:#22d3ee;--c0:#5aa9ff;--c1:#a9b8cf;--c2:#4ade80;--c3:#fbbf24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans Thai','Noto Sans Thai',Sarabun,system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding:10px 16px;background:#0e1424;border-bottom:3px solid var(--acc)}
h1{margin:0;font-size:1.15rem;font-weight:700;line-height:1.3}
.sub{margin:0;color:var(--ink2);font-size:.78rem}
.ctl{display:flex;align-items:center;gap:6px}
button{font:inherit;color:var(--ink);background:#172036;border:1px solid #2a3857;border-radius:999px;min-height:36px;padding:0 14px;cursor:pointer}
button:hover{background:#1f2c49}button:focus-visible,.nd:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#play{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;padding:0 18px}
.cnt{min-width:5.2em;text-align:center;color:var(--ink2);font-size:.85rem;font-variant-numeric:tabular-nums}
.split{flex:1;min-height:0;display:grid;grid-template-columns:5fr 6fr}
.scene{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:#16110e}
.cap{flex:none;display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:#0e1424;border-bottom:1px solid var(--line);min-height:64px;font-weight:500}
.cap i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:7px;background:var(--c0);box-shadow:0 0 10px currentColor}
.cap small{display:block;color:var(--ink2);font-weight:400;font-size:.76rem}
#sc{flex:1;min-height:0;width:100%}
.dp{min-width:0;min-height:0;overflow:auto;background:var(--bg);position:relative}
.wrap{min-width:640px}
.lanes{position:sticky;top:0;z-index:3;display:flex;padding-left:2.56%;background:#0e1424;border-bottom:1px solid var(--line)}
.lanes b{flex:1;text-align:center;padding:6px 0;font-size:.85rem;border-bottom:3px solid var(--lc)}
.lanes b span{display:block;font-weight:400;font-size:.68rem;color:var(--ink2)}
#dia{display:block;width:100%;height:auto}
.zt{fill:#d9c9a8;font-size:13px;text-anchor:middle;font-weight:600}
.kt{fill:#22d3ee;font-size:12px;text-anchor:middle;font-weight:600}
.em{font-size:34px;text-anchor:middle;dominant-baseline:central}
.ic{font-size:22px;text-anchor:middle;dominant-baseline:central}
.ch{transition:transform 1.4s cubic-bezier(.45,0,.25,1)}
.mv .em{animation:hop .38s ease-in-out infinite}
.eat .em{animation:hop .8s ease-in-out infinite}
.cook{animation:hop .5s ease-in-out infinite}
.ring{animation:ring .5s ease-in-out 4}
@keyframes hop{50%{transform:translateY(-6px)}}
@keyframes ring{25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
#bell,#fire{transform-box:fill-box;transform-origin:center}
.fade{transition:opacity .6s}
.ep{fill:none;stroke:#566884;stroke-width:1.8;marker-end:url(#ar)}
.ep.hot{stroke:var(--gold);stroke-width:3.2;stroke-dasharray:9 7;animation:fl .7s linear infinite}
@keyframes fl{to{stroke-dashoffset:-16}}
.nd{cursor:pointer;outline:none}
.sh{fill:#141c2f;stroke:var(--lc,#7f93b2);stroke-width:2}
.nd.d .sh{fill:#2a2410;stroke:var(--gold)}
.nd.se .sh{fill:#eaf0fb;stroke:#eaf0fb}
.nd.done .sh{fill:#1b2a44}
.nd.on .sh{stroke:var(--acc);stroke-width:4;filter:drop-shadow(0 0 9px var(--acc))}
.nt{fill:var(--ink);font-size:12.5px;text-anchor:middle;dominant-baseline:central}
.lp{fill:var(--gold);font-size:11px;text-anchor:middle}
@media(max-width:860px){.split{grid-template-columns:1fr;grid-template-rows:46% 1fr}.scene{border-right:0;border-bottom:1px solid var(--line)}.cap{min-height:56px;font-size:.88rem}.sub{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#sc{position:relative;overflow:hidden;background:#120d0a}
#sys{position:absolute;left:10px;right:10px;bottom:10px;padding:8px 12px;background:#0a1220ee;border:1px solid #22d3ee55;border-left:4px solid var(--cyan);border-radius:8px;color:#7dd3fc;font-size:.82rem;font-weight:500;pointer-events:none}
#tools{position:absolute;top:8px;left:10px;right:200px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
.camb{font-size:.7rem;min-height:26px;padding:0 10px;background:#000a;border-color:#ffffff33;color:#e7dcc8}
.opts{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:.76rem;color:var(--ink2)}
.opts label{display:flex;align-items:center;gap:4px}
.opts select{font:inherit;color:var(--ink);background:#172036;border:1px solid #2a3857;border-radius:999px;min-height:30px;padding:0 8px}
.lanes b.hl{background:#ffffff1f}
#info{position:absolute;left:10px;bottom:66px;max-width:250px;z-index:4;background:#0a1220ee;border:1px solid #ffffff33;border-radius:10px;padding:8px 26px 8px 12px;font-size:.78rem;color:#e7dcc8;display:none}
#info.show{display:block}#info ul{margin:4px 0 0 16px;padding:0}#info .x{position:absolute;top:4px;right:9px;cursor:pointer}
#phone{position:absolute;right:10px;bottom:66px;width:136px;height:246px;z-index:3;border:5px solid #0b0f17;border-radius:22px;background:#fff;color:#111;overflow:hidden;box-shadow:0 8px 24px #000a;opacity:0;transform:translateY(24px) scale(.9);transition:.35s;pointer-events:none;font-size:11px;line-height:1.35}
#phone.show{opacity:1;transform:none}
#pscr{height:100%;display:flex;flex-direction:column;gap:5px}
.ph-h{background:#b3202a;color:#fff;text-align:center;padding:5px 0;font-weight:700;letter-spacing:.02em}
.ph-t{text-align:center;font-weight:700;margin:2px 6px 0}
.ph-s{text-align:center;color:#666;font-size:.88em;margin:0 6px}
.ph-b{margin:0 8px;padding:6px;border-radius:8px;background:#e8eef7;text-align:center;font-weight:600}
.ph-b.ghost{background:#f1f1f1;color:#777}
.ph-b.tap,.ph-b.sel{animation:phtap .7s 1.1s both}
.ph-b.conf{background:#2563eb;color:#fff;animation:phconf .4s 1.2s both}
@keyframes phtap{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1);background:#b3202a;color:#fff}}
@keyframes phconf{to{background:#16a34a}}
.ph-big{text-align:center;font-size:2.7em;font-weight:800;color:#b3202a;line-height:1}
.ph-dots{display:flex;justify-content:center;gap:4px}.ph-dots i{width:7px;height:7px;border-radius:50%;background:#b3202a;animation:phdot 1s infinite}.ph-dots i:nth-child(2){animation-delay:.2s}.ph-dots i:nth-child(3){animation-delay:.4s}
@keyframes phdot{0%,100%{opacity:.25}50%{opacity:1}}
.ph-box{position:relative;margin:4px auto 0;width:84px;height:84px}
.ph-scan{position:absolute;inset:0;border:2px solid #222;border-radius:8px;background:repeating-linear-gradient(45deg,#222 0 4px,#fff 4px 8px);overflow:hidden}
.ph-box .ph-ok+*{}
.ph-line{position:absolute;left:0;right:0;height:3px;background:#22d3ee;box-shadow:0 0 8px #22d3ee;animation:phscan 1.2s linear infinite}
@keyframes phscan{from{top:0}to{top:100%}}
.ph-ok{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;font-weight:700;color:#16a34a;opacity:0;animation:phin .3s 1.8s forwards;font-size:1.15em;z-index:1}
.ph-ok.now{position:static;opacity:1;animation:none;margin:8px;font-size:1.3em;display:block;text-align:center}
@keyframes phin{to{opacity:1}}
.ph-ok2{margin:4px 6px;text-align:center;font-weight:700;color:#16a34a;opacity:0;animation:phin .3s 1.8s forwards}
.ph-in{margin:0 8px;border:1px solid #cbd5e1;border-radius:6px;padding:5px;background:#fafafa;min-height:1.4em}
.ph-type{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;width:0;animation:phtyp .9s steps(8) both}
@keyframes phtyp{to{width:9ch}}
.ph-chips{display:flex;gap:3px;margin:4px 6px 0;flex-wrap:wrap}.ph-chips b{background:#fde68a;border-radius:99px;padding:1px 6px;font-size:.9em}
.ph-row{display:flex;justify-content:space-between;margin:0 8px;padding:3px 0;border-bottom:1px dashed #ddd}.ph-row.out{color:#aaa;text-decoration:line-through}
.ph-add{background:#16a34a;color:#fff;border-radius:50%;width:15px;height:15px;display:inline-block;text-align:center;line-height:15px;margin-left:4px}
.ph-cart{margin:auto 8px 6px;background:#111;color:#fff;border-radius:8px;padding:6px;text-align:center;animation:phpop .5s 1.2s both}
@keyframes phpop{50%{transform:scale(1.08)}}
.ph-st{margin:0 10px;padding:3px 0 3px 18px;position:relative;color:#aaa}.ph-st:before{content:'';position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:#ddd}.ph-st.done{color:#16a34a}.ph-st.done:before{background:#16a34a}.ph-st.on{color:#111;font-weight:700}.ph-st.on:before{background:#b3202a;animation:phdot 1s infinite}
.ph-slip{margin:4px 14px;border:1px solid #ccc;border-radius:6px;padding:6px;text-align:center;background:#f8fafc}
@media(max-width:860px){#tools{right:10px;top:34px}}
.split{grid-template-columns:68fr 32fr}
.split.m-half{grid-template-columns:5fr 6fr}
.split.m-full{grid-template-columns:1fr}
.split.m-full .dp{display:none}
.split.m-full .scene{border-right:0}
@media(max-width:860px){.split{grid-template-columns:1fr;grid-template-rows:68% 1fr}.split.m-half{grid-template-rows:46% 1fr}.split.m-full{grid-template-rows:1fr}}

#sys{font-size:calc(.82rem*var(--ui,1));padding:calc(8px*var(--ui,1)) calc(14px*var(--ui,1));border-left-width:calc(4px*var(--ui,1))}
#info{font-size:calc(.78rem*var(--ui,1));max-width:calc(250px*var(--ui,1));bottom:calc(18px + 52px*var(--ui,1))}
#phone{scale:var(--ps,1);transform-origin:right bottom;bottom:calc(18px + 52px*var(--ui,1))}

.hint{position:absolute;top:8px;right:10px;z-index:2;font-size:.7rem;color:#c9b79a;background:#0008;padding:2px 8px;border-radius:99px;pointer-events:none}
.bar{background:linear-gradient(90deg,#1a0f12,#0e1424 60%)}
h1{letter-spacing:.01em}
.cap{border-left:4px solid var(--acc)}

<div class="app">
<header class="bar">
 <div><h1>ร้านอาหารญี่ปุ่น · โมเดลจำลอง + Activity Diagram</h1><p class="sub">ซ้าย: ฉากจำลองร้าน · ขวา: แผนผังการทำงานของระบบ (เดินพร้อมกัน)</p></div>

<section class="scene">

</section>
<section class="dp" id="dp"><div class="wrap">
<div class="lanes"><b style="--lc:var(--c0)">ลูกค้า<span>Customer</span></b><b style="--lc:var(--c1)">ระบบ<span>System</span></b><b style="--lc:var(--c2)">พนักงานหน้าร้าน<span>Employee</span></b><b style="--lc:var(--c3)">พนักงานครัว<span>Kitchen</span></b></div>
<svg id="dia" role="img" aria-label="Activity Diagram ร้านอาหารญี่ปุ่น"></svg>
</div></section>
</main></div>
